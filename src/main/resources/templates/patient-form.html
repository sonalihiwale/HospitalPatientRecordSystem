<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patient Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">Hospital Patient Record System</span>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow mx-auto" style="max-width: 750px;">

        <div class="card-header bg-primary text-white">
            <h4 th:text="${patient.patientId == null ?
                'Register New Patient' : 'Update Patient Details'}">
                Patient Registration
            </h4>
        </div>

        <div class="card-body">

            <form th:object="${patient}"
                  th:action="${patient.patientId == null ?
                  '/patients/save' :
                  '/patients/update/' + patient.patientId}"
                  method="post">

                <!-- CSRF Security -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- Full Name -->
                <div class="mb-3">
                    <label class="form-label">Full Name</label>

                    <input type="text"
                           th:field="*{fullName}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                           placeholder="Enter patient name"
                           maxlength="100">

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}">
                    </div>
                </div>

                <!-- Age -->
                <div class="mb-3">
                    <label class="form-label">Age</label>

                    <input type="number"
                           th:field="*{age}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('age')} ? 'is-invalid' : ''"
                           placeholder="Enter age"
                           min="1" max="120">

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('age')}"
                         th:errors="*{age}">
                    </div>
                </div>

                <!-- Gender -->
                <div class="mb-3">
                    <label class="form-label">Gender</label>

                    <select th:field="*{gender}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid' : ''">

                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('gender')}"
                         th:errors="*{gender}">
                    </div>
                </div>

                <!-- Contact Number -->
                <div class="mb-3">
                    <label class="form-label">Contact Number</label>

                    <input type="tel"
                           th:field="*{contactNumber}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('contactNumber')} ? 'is-invalid' : ''"
                           placeholder="Enter 10-digit mobile number"
                           maxlength="10">

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('contactNumber')}"
                         th:errors="*{contactNumber}">
                    </div>
                </div>

                <!-- Address -->
                <div class="mb-3">
                    <label class="form-label">Address</label>

                    <textarea th:field="*{address}"
                              class="form-control"
                              th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"
                              rows="2"
                              placeholder="Enter address"></textarea>

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('address')}"
                         th:errors="*{address}">
                    </div>
                </div>

				<!-- Medical History - Admin Only -->
				<div class="mb-3" sec:authorize="hasRole('ADMIN')">
				    <label class="form-label">Medical History</label>

				    <textarea th:field="*{medicalHistory}"
				              class="form-control"
				              th:classappend="${#fields.hasErrors('medicalHistory')} ? 'is-invalid' : ''"
				              rows="4"
				              placeholder="Enter medical history"></textarea>

				    <div class="text-danger"
				         th:if="${#fields.hasErrors('medicalHistory')}"
				         th:errors="*{medicalHistory}">
				    </div>
				</div>

                <!-- Buttons -->
                <button type="submit" class="btn btn-success">
                    Save Patient
                </button>

                <a th:href="@{/patients}"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>
    </div>
</div>

</body>
</html>
