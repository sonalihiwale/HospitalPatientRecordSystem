```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Patient Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h4>Patient Details</h4>
        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <tr>
                    <th>Patient ID</th>
                    <td th:text="${patient.patientId}"></td>
                </tr>

                <tr>
                    <th>Full Name</th>
                    <td th:text="${patient.fullName}"></td>
                </tr>

                <tr>
                    <th>Age</th>
                    <td th:text="${patient.age}"></td>
                </tr>

                <tr>
                    <th>Gender</th>
                    <td th:text="${patient.gender}"></td>
                </tr>

                <tr>
                    <th>Contact Number</th>
                    <td th:text="${patient.contactNumber}"></td>
                </tr>

                <tr>
                    <th>Address</th>
                    <td th:text="${patient.address}"></td>
                </tr>

				<tr sec:authorize="hasRole('ADMIN')">
				    <th>Medical History</th>
				    <td th:text="${patient.medicalHistory}"></td>
				</tr>
				<tr>
				    <th>Created Date</th>
				    <td th:text="${#temporals.format(patient.createdAt, 'dd-MM-yyyy hh:mm a')}"></td>
				</tr>

            </table>

            <a th:href="@{/patients}"
               class="btn btn-secondary">
                Back to Dashboard
            </a>

        </div>

    </div>

</div>

</body>
</html>
```
